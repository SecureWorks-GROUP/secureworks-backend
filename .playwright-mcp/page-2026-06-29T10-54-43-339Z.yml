      - heading "Common Questions" [level=2] [ref=e379]
    - generic [ref=e380]:
      - generic [ref=e381]:
        - button "What's the difference between a patio and a pergola?" [ref=e382] [cursor=pointer]:
          - text: What's the difference between a patio and a pergola?
          - img [ref=e383]
        - generic [ref=e385]: A patio has a solid, waterproof roof — full shade and rain protection. A pergola has open battens or lattice, giving filtered light but no weather protection. We build both. If you want to use the space year-round, you need a solid roof.
      - generic [ref=e386]:
        - button "Do I need council approval for a patio in [SUBURB]?" [ref=e387] [cursor=pointer]:
          - text: Do I need council approval for a patio in [SUBURB]?
          - img [ref=e388]
        - generic [ref=e390]: "Almost always, yes. Most patios qualify for a CDC (Complying Development Certificate) — typically approved in 1–3 weeks. We handle the entire process: drafting, engineering, and council lodgement."
      - generic [ref=e391]:
        - button "How long does a patio take from start to finish?" [ref=e392] [cursor=pointer]:
          - text: How long does a patio take from start to finish?
          - img [ref=e393]
        - generic [ref=e395]: On-site build is typically 2–5 days. Total timeline from quote to completion is usually 6–10 weeks including drafting, council approval, and materials ordering. We keep you updated at every stage.
      - generic [ref=e396]:
        - button "What's the best roofing material for Perth?" [ref=e397] [cursor=pointer]:
          - text: What's the best roofing material for Perth?
          - img [ref=e398]
        - generic [ref=e400]: Depends on the space. Colorbond steel is proven and affordable for carports and basic shade. Insulated panels (SolarSpan) are the clear winner for entertaining areas — up to 22°C cooler, silent in rain. We'll recommend what makes sense for your situation, not just the most expensive option.
      - generic [ref=e401]:
        - button "How much does a patio cost in Perth?" [ref=e402] [cursor=pointer]:
          - text: How much does a patio cost in Perth?
          - img [ref=e403]
        - generic [ref=e405]: Shade structures start from $3,000, steel sheet patios $5,000–$20,000, insulated patios $12,000–$50,000+. See our price guide above for full ranges. Your quote will be fully itemised — engineering, drafting, and council fees included. No hidden costs.
