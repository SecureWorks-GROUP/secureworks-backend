      - paragraph [ref=e126]: We build them all — so we recommend what's actually best for you. Here's an honest look at every option.
    - generic [ref=e127]:
      - generic [ref=e130]:
        - heading "Steel Sheet Patio" [level=3] [ref=e131]
        - paragraph [ref=e132]: Clean, practical Colorbond coverage that matches your existing roof. The reliable choice for carports, alfresco areas, and covered outdoor zones.
        - generic [ref=e133]:
          - strong [ref=e134]: "Great for:"
          - text: Carports, alfresco shade, side entries
        - generic [ref=e135]: "Our take: Perfect for solid coverage without the premium — we can add polycarb lites for natural light too."
      - generic [ref=e138]:
        - heading "Insulated Panel Patio" [level=3] [ref=e139]
        - paragraph [ref=e140]: Roof, insulation, and a flat ceiling in one panel. Up to 22°C cooler, silent in rain, ready for downlights and fans. This is where a patio becomes a room.
        - generic [ref=e141]:
          - strong [ref=e142]: "Great for:"
          - text: Outdoor dining, entertaining, second living rooms
        - generic [ref=e143]: "Our take: If you'll actually live in the space — not just walk through it — insulated is worth every dollar."
        - link "Learn more on our Insulated Patios page →" [ref=e144] [cursor=pointer]:
          - /url: "#"
      - generic [ref=e147]:
        - heading "Timber Pergola / Patio" [level=3] [ref=e148]
        - paragraph [ref=e149]: Real timber brings warmth and character that steel can't replicate. Jarrah, merbau, or treated pine — stunning on federation, Hamptons, and coastal homes.
        - generic [ref=e150]:
          - strong [ref=e151]: "Great for:"
          - text: Character homes, pools, design-led builds
        - generic [ref=e152]: "Our take: Pair a timber frame with insulated roofing for the best of both worlds."
      - generic [ref=e155]:
        - heading "Open Pergola / Shade" [level=3] [ref=e156]
        - paragraph [ref=e157]: Posts, beams, and battens — with shade cloth, climbing plants, or left open. The simplest way to define an outdoor space on a budget.
        - generic [ref=e158]:
          - strong [ref=e159]: "Great for:"
          - text: Garden features, poolside, wisteria structures
        - generic [ref=e160]: "Our take: Sometimes simple is exactly right — and we'll tell you when that's the case."
