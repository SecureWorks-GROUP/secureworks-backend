  - generic [ref=e325]:
    - generic [ref=e326]:
      - generic [ref=e327]: FAQ
      - heading "Common Questions" [level=2] [ref=e328]
    - generic [ref=e329]:
      - generic [ref=e330]:
        - button "How much does aluminium slat fencing cost in Perth?" [ref=e331] [cursor=pointer]:
          - text: How much does aluminium slat fencing cost in Perth?
          - img [ref=e332]
        - generic [ref=e334]: Aluminium slat fencing typically starts from $350 per lineal metre fully installed, depending on height, spacing, and finish. A standard residential boundary fence usually ranges from $7,000 to $18,000. We provide fixed-price quotes after a free design consultation — no surprises.
      - generic [ref=e335]:
        - button "Is aluminium fencing better than Colorbond?" [ref=e336] [cursor=pointer]:
          - text: Is aluminium fencing better than Colorbond?
          - img [ref=e337]
        - generic [ref=e339]: "For premium properties, aluminium offers significant advantages: it won't rust, dent, or warp, comes in 22+ colours including woodgrain finishes, is BAL-29/BAL-40 rated for bushfire zones, and has a 25+ year lifespan with zero maintenance. It's the preferred choice for homes valued $800K and above."
      - generic [ref=e340]:
        - button "What is BAL rated fencing and do I need it?" [ref=e341] [cursor=pointer]:
          - text: What is BAL rated fencing and do I need it?
          - img [ref=e342]
        - generic [ref=e344]: BAL (Bushfire Attack Level) rated fencing meets Australian Standards for properties in bushfire-prone areas. Many Perth suburbs require BAL-29 or BAL-40 rated fencing. Aluminium is non-combustible and meets these requirements, unlike timber alternatives. We can check your property's BAL rating during our free consultation.
      - generic [ref=e345]:
        - button "Do I need council approval for a new fence?" [ref=e346] [cursor=pointer]:
          - text: Do I need council approval for a new fence?
          - img [ref=e347]
        - generic [ref=e349]: In most Perth local government areas, fences under 1.8m at the side or rear and under 1.2m at the front do not require council approval. Fences above these heights, or in heritage areas, typically need a building permit. We check your local council requirements during our free design consultation and handle any approvals needed.
      - generic [ref=e350]:
        - button "Can you install privacy screening on an existing patio?" [ref=e351] [cursor=pointer]:
          - text: Can you install privacy screening on an existing patio?
          - img [ref=e352]
        - generic [ref=e354]: Absolutely. Aluminium privacy screening is one of our most popular additions to existing patios. We can retrofit screening panels to patio structures, pergolas, and boundary walls. As patio builders ourselves, we understand the structural requirements and ensure a perfect integration.
      - generic [ref=e355]:
        - button "Do you do fencing for property managers and strata?" [ref=e356] [cursor=pointer]:
          - text: Do you do fencing for property managers and strata?
          - img [ref=e357]
        - generic [ref=e359]:
          - text: Yes — scheduled replacement programs, priority emergency response, volume pricing, direct invoicing, and photo documentation. We're also Category B licensed for asbestos fence removal.
          - link "Learn more." [ref=e360] [cursor=pointer]:
            - /url: "#property-managers"
      - generic [ref=e361]:
        - button "How long does installation take?" [ref=e362] [cursor=pointer]:
          - text: How long does installation take?
          - img [ref=e363]
        - generic [ref=e365]: Most residential aluminium fencing projects are completed in 1–3 days once materials arrive. The full process — from design consultation to finished installation — typically takes 3–4 weeks, including manufacture and any council approvals. We provide a clear timeline in your detailed design proposal.
