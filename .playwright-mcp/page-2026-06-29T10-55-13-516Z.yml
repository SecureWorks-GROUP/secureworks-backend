    - generic [ref=e105]:
      - generic [ref=e106]: The Problem
      - heading "Your Deck Isn't Working For You" [level=2] [ref=e107]:
        - text: Your Deck Isn't
        - text: Working For You
      - paragraph [ref=e108]: Perth's extreme UV, 42°C summers, and winter rain destroy timber decks fast. If your outdoor space is falling apart, it's costing you weekends, money, and property value.
    - generic [ref=e109]:
      - generic [ref=e110]:
        - generic [ref=e111]: 🪵
        - generic [ref=e112]:
          - heading "Constant Maintenance" [level=3] [ref=e113]
          - paragraph [ref=e114]: Every summer your Merbau deck needs sanding and oiling again. You spent $20,000 on a deck — and now you spend every autumn weekend maintaining it. Life's too short for that.
      - generic [ref=e115]:
        - generic [ref=e116]: 🌡️
        - generic [ref=e117]:
          - heading "Too Hot to Use" [level=3] [ref=e118]
          - paragraph [ref=e119]: Dark timber absorbs Perth's brutal summer heat. By January, your deck is untouchable after 10am. The kids can't play barefoot, the dog burns its paws, and your outdoor entertaining dies.
      - generic [ref=e120]:
        - generic [ref=e121]: 🪳
        - generic [ref=e122]:
          - heading "Rot, Termites & Splinters" [level=3] [ref=e123]
          - paragraph [ref=e124]: Trapped moisture rots joists from the inside out. Termites love untreated subframes. And every barefoot walk is a splinter lottery. Your deck looked great in year one — but year five tells a different story.
      - generic [ref=e125]:
        - generic [ref=e126]: 📉
        - generic [ref=e127]:
          - heading "Detracts From Your Home" [level=3] [ref=e128]
          - paragraph [ref=e129]: A grey, weathered, neglected deck doesn't add value — it subtracts it. Buyers see a maintenance burden, not a lifestyle asset. The deck you built to add value is now costing you at resale.
  - generic [ref=e131]:
