        - img [ref=e139]
        - heading "Zero Maintenance" [level=3] [ref=e141]
        - paragraph [ref=e142]: No oiling. No sanding. No staining. Premium capped composite resists UV, moisture, mould, and staining for 25+ years. Just hose it down occasionally. Get your weekends back.
        - generic [ref=e143]: Save 100+ hours over 25 years
      - generic [ref=e144]:
        - img [ref=e146]
        - heading "25-Year Warranty" [level=3] [ref=e148]
        - paragraph [ref=e149]: Premium composite brands offer 25–50 year structural and fade warranties. Compare that to the annual oil-and-hope cycle of timber. Your investment is protected, in writing.
