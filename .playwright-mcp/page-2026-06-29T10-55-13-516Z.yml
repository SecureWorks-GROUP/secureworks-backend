      - generic [ref=e133]: The Solution
      - heading "Why Smart Perth Homeowners Choose Composite" [level=2] [ref=e134]
      - paragraph [ref=e135]: Modern composite decking combines the look of real timber with engineered durability. No oiling, no sanding, no rot — just a deck that looks perfect for 25+ years.
