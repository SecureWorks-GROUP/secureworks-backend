    - generic [ref=e495]:
      - generic [ref=e496]: FAQ
      - heading "Common Questions About Decking" [level=2] [ref=e497]
    - generic [ref=e498]:
      - generic [ref=e499]:
        - button "How much does a deck cost in Perth?" [ref=e500] [cursor=pointer]:
          - text: How much does a deck cost in Perth?
          - img [ref=e501]
        - generic [ref=e503]: "Deck costs depend on material, size, height, and site conditions. As a guide: Treated Pine starts from $250/m², Merbau from $380/m², and Composite from $400/m² — all fully installed including subframe. A typical 25m² composite deck runs $10,000–$15,000. We provide fully itemised, fixed-price quotes after a free site visit — no surprises."
      - generic [ref=e504]:
        - button "Do I need council approval for a deck in Perth?" [ref=e505] [cursor=pointer]:
          - text: Do I need council approval for a deck in Perth?
          - img [ref=e506]
        - generic [ref=e508]: It depends on your council and deck specifications. In the City of Wanneroo, ALL decking requires a building permit regardless of size. In Joondalup, permits are needed when the deck exceeds 20m², is higher than 500mm, or is near a boundary. Decks over 500mm high are treated as balconies with 7.5m setback requirements. We check your specific requirements and handle the entire approval process.
      - generic [ref=e509]:
        - button "Composite or timber — which should I choose?" [ref=e510] [cursor=pointer]:
          - text: Composite or timber — which should I choose?
          - img [ref=e511]
        - generic [ref=e513]: Both are excellent choices. Composite is best if you want zero maintenance, long warranties, and never want to oil a deck again. Timber (Merbau, Spotted Gum) is best if you love the natural feel and don't mind annual oiling. We install both and will give you honest advice based on your priorities, budget, and block orientation during the site visit.
      - generic [ref=e514]:
        - button "Will composite decking get too hot in Perth?" [ref=e515] [cursor=pointer]:
          - text: Will composite decking get too hot in Perth?
          - img [ref=e516]
        - generic [ref=e518]: All decking materials get hot in direct Perth sun — timber included. Dark colours are hotter than light colours regardless of material. We recommend lighter composite tones (Teak, Coastal Grey, Silver) for north and west-facing decks. Premium composites with heat-mitigating technology (like Trex Lineage) also help. The real solution? Pair your deck with an insulated patio roof for shade — we build those too.
      - generic [ref=e519]:
        - button "How long does it take to build a deck?" [ref=e520] [cursor=pointer]:
          - text: How long does it take to build a deck?
          - img [ref=e521]
        - generic [ref=e523]: "Most residential decks are completed in 3–5 days on site. The full timeline from quote acceptance to completion is typically 3–6 weeks: 1 week for detailed design and engineering, 1–3 weeks for council approval (if required), and 3–5 days for the build itself. We keep you updated throughout."
      - generic [ref=e524]:
        - button "What's the difference between a registered builder and a carpenter?" [ref=e525] [cursor=pointer]:
          - text: What's the difference between a registered builder and a carpenter?
          - img [ref=e526]
        - generic [ref=e528]: Under WA law, a registered builder provides Home Indemnity Insurance (mandatory for projects over $20,000), 6-year statutory warranties, and access to the Building Commissioner if anything goes wrong. A carpenter or unlicensed tradesperson provides none of these protections. For a $15,000–$35,000 deck, that protection matters. Ask any deck builder for their registration number — if they don't have one, ask why.
      - generic [ref=e529]:
        - button "Can you build a deck and patio roof together?" [ref=e530] [cursor=pointer]:
          - text: Can you build a deck and patio roof together?
          - img [ref=e531]
        - generic [ref=e533]: Absolutely — it's one of our most popular combinations. Building both at the same time means one team, one disruption, coordinated design, and one warranty. Most deck + insulated patio roof packages run $30,000–$60,000 depending on size and materials. We'll discuss the full scope at your site visit.
      - generic [ref=e534]:
        - button "Do you offer finance?" [ref=e535] [cursor=pointer]:
          - text: Do you offer finance?
          - img [ref=e536]
        - generic [ref=e538]: Yes, we offer flexible finance options. We'll discuss what works for your situation during the site visit. Standard payment terms are deposit on acceptance, progress payments at milestones, and balance on completion.
