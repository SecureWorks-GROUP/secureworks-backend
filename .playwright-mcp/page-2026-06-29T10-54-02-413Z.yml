    - generic [ref=e509]:
      - generic [ref=e510]: FAQ
      - heading "Common Questions" [level=2] [ref=e511]
    - generic [ref=e512]:
      - generic [ref=e513]:
        - button "How much does an insulated patio cost in [SUBURB]?" [ref=e514] [cursor=pointer]:
          - text: How much does an insulated patio cost in [SUBURB]?
          - img [ref=e515]
        - generic [ref=e517]: Insulated patios in Perth typically range from $12,000 for a small attached flat patio to $45,000+ for large gable or flyover designs. The final cost depends on size, roof style, site conditions, and council requirements. Our quotes are fully itemised with no hidden costs — engineering, drafting, and council fees are included. Book a free site visit and we'll provide your exact price — fully itemised, no surprises.
      - generic [ref=e518]:
        - button "Do I need council approval for a patio in [SUBURB]?" [ref=e519] [cursor=pointer]:
          - text: Do I need council approval for a patio in [SUBURB]?
          - img [ref=e520]
        - generic [ref=e522]: Almost always, yes. Patios are classified as Class 10a buildings under the National Construction Code, which means they require a building permit. If your patio meets all standard setback and height requirements (R-Codes), it qualifies for a CDC (Complying Development Certificate) — typically approved in 1–3 weeks. If variations are needed, a DA (Development Application) is required, taking 6–12 weeks. We handle the entire process for you.
      - generic [ref=e523]:
        - button "What's the difference between insulated and non-insulated?" [ref=e524] [cursor=pointer]:
          - text: What's the difference between insulated and non-insulated?
          - img [ref=e525]
        - generic [ref=e527]: Standard patios use single-skin Colorbond sheets — cheaper but they transmit heat and amplify rain noise. Insulated panels (SolarSpan) are a sandwich of steel, EPS foam insulation, and a pre-finished steel ceiling. You get thermal insulation (up to R2.4), acoustic dampening, and a flat ceiling finish all in one panel. They also span further without battens, giving you cleaner lines and fewer posts.
      - generic [ref=e528]:
        - button "How long does the whole process take?" [ref=e529] [cursor=pointer]:
          - text: How long does the whole process take?
          - img [ref=e530]
        - generic [ref=e532]: "From acceptance to completion, a typical insulated patio takes 6–8 weeks: 1–2 weeks for drafting and engineering, 1–3 weeks for CDC approval, 1 week for materials, and 2–3 days for installation. DA projects take longer (12+ weeks). We keep you updated throughout."
      - generic [ref=e533]:
        - button "Can you attach to my existing house roof?" [ref=e534] [cursor=pointer]:
          - text: Can you attach to my existing house roof?
          - img [ref=e535]
        - generic [ref=e537]: Yes — most of our patios are attached to the existing house. We assess your fascia, wall type, and existing roof to determine the best attachment method. For homes where attachment isn't ideal, freestanding and flyover designs are excellent alternatives that don't touch your existing roof at all.
      - generic [ref=e538]:
        - button "What Colorbond colours are available?" [ref=e539] [cursor=pointer]:
          - text: What Colorbond colours are available?
          - img [ref=e540]
        - generic [ref=e542]: Over 22 Colorbond colours are available. Popular choices in Perth include Surfmist, Paperbark, Shale Grey, Dune, Evening Haze, Basalt, Woodland Grey, and Monument. With insulated panels, you can choose different colours for the top and ceiling surfaces independently.
      - generic [ref=e543]:
        - button "Do you offer finance?" [ref=e544] [cursor=pointer]:
