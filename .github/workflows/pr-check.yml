name: PR Check — Edge Functions

on:
  pull_request:
    # Do not restrict to main. That filter matches the PR base, so stacked
    # packet PRs targeting cio/context-b*-recovery never ran deno-check,
    # migration-contracts or ses-proof-harness. 834 and 835 pass because
    # they target main. Run the same three jobs on every PR that touches
    # these paths.
    paths:
      - "supabase/functions/**"
      # Migrations-only and scripts-only PRs must still trigger the required
      # deno-check status (the job no-ops to pass when no function files
      # changed) — otherwise branch protection waits forever and the PR can
      # never merge. Prefer scripts/** over a hardcoded list so new files under
      # scripts/ (e.g. evidence checkers) still fire the required check.
      - "supabase/migrations/**"
      - "supabase/tests/migration-contracts/**"
      - "scripts/**"
      - "scripts/deploy-edge-function.sh"
      - "scripts/smoke-edge-functions.sh"
      - "scripts/smoke-ops-api-action-surface.sh"
      - "scripts/_ops-api-required-actions.txt"
      - "scripts/identify-edge-deploy-changes.sh"
      - "scripts/apply-pending-migrations.sh"
      - "scripts/migration-autoapply-exclusions.txt"
      - "scripts/migration-autoapply-ledger-aliases.txt"
      - "scripts/check-edge-deploy-guardrails.sh"
      - "scripts/check-edge-schema-preflight.sh"
      - "scripts/edge-function-schema-requirements.txt"
      - "scripts/check-ops-api-source-actions.sh"
      - "scripts/test/test-deploy-edge-functions-workflow.sh"
      - "scripts/test/test-apply-pending-migrations.sh"
      - "scripts/test/test-edge-schema-preflight.sh"
      - "scripts/test/test-smoke-ops-api-action-surface.sh"
      - ".github/workflows/deploy-edge-functions.yml"
      - ".github/workflows/pr-check.yml"
      # Same reason as migrations/scripts above: deno-check is a REQUIRED status,
      # so any path that can be changed alone must trigger it or the PR is
      # unmergeable. A watchdog-only PR hit exactly that and sat at BLOCKED
      # with zero checks.
      - ".github/workflows/makesafe-intake-watchdog.yml"
      # Same reason again for the SES Reporting proof harness: these paths can be
      # changed alone, and the ses-proof-harness job below is the only automated
      # coverage the harness has. Why the harness owns its own npm project under
      # tests/e2e is documented in docs/ses-reporting-proof-harness.md.
      - "tests/e2e/**"
      # Same reason a fourth time, for evidence and project-memory changes.
      # An agent run that lands only its report, screenshots and ledgers under
      # data/ — or only updates AGENTS.md / CLAUDE.md — matched NO path here, so
      # deno-check never registered and the PR sat at BLOCKED with zero checks,
      # exactly like the watchdog-only PR above. Measured on PR #509
      # (68 files, all under data/ plus AGENTS.md): mergeStateStatus BLOCKED,
      # statusCheckRollup 0. `*` does not match `/`, so '*.md' is the six
      # tracked ROOT markdown files only and does not pull in docs/**.
      - "data/**"
      - "*.md"
      # Same reason a fifth time, and it is the gap the note above NAMES without
      # closing: '*.md' is root-only, so a PR landing only docs/** — a diagnosis
      # under docs/evidence/, an ADR, a contract — matched no path here at all.
      # deno-check is the ONE required status on main, so such a PR registers
      # zero check runs and is unmergeable BY CAUSE, not by failure. Measured on
      # PR #631 (3 files, all docs/evidence/**): `gh run list --branch` returned
      # count 0 and mergeStateStatus BLOCKED. This is the correct fix for that
      # class: the remedy for "no workflow matched the diff" is the trigger, and
      # re-running changes nothing because there is no run to re-run. It weakens
      # nothing — deno-check diffs for supabase/functions/** itself and no-ops to
      # pass when none changed, exactly as it already does for a migrations-only
      # or data/-only PR. This subsumes the former single-file
      # 'docs/ses-reporting-proof-harness.md' entry.
      - "docs/**"
      # The committed-service-key guard below scans every tracked file, but it
      # only runs when this workflow fires. A PR that only swaps the browser
      # apps' Supabase keys (legacy-key removal Step G) touches just these
      # paths, so without them a pasted sb_secret_ key would merge unchecked.
      # '*.html' is root-only, like '*.md' above.
      - "supabase/config.js"
      - "supabase/config.example.js"
      - "tools/**"
      - "*.html"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Identify changed function files
        id: changed
        run: |
          # Use the PR base SHA for diffing (more reliable in CI)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get the list of changed function index.ts files in the PR.
          # --diff-filter=d excludes deletions: a removed function has no file
          # left to check, and passing its path to deno would fail the job.
          CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- 'supabase/functions/*/index.ts' | sort -u)
          SHARED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- 'supabase/functions/_shared/*.ts' 'supabase/functions/_shared/**/*.ts' | sort -u)

          if [ -z "$CHANGED" ] && [ -z "$SHARED" ]; then
            echo "No edge function files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            # Write changed files to a temp file for the check step
            {
              echo "$CHANGED"
              echo "$SHARED"
            } | grep -v '^$' | sort -u > /tmp/changed_function_files.txt
            echo "Changed files:"
            cat /tmp/changed_function_files.txt
          fi

      # Deno type check — advisory (non-blocking) for now because ops-api
      # and send-quote have pre-existing type errors that would block every
      # PR touching them. The check still runs so new type regressions are
      # visible in the CI log. Once the known errors are fixed, switch to
      # a hard-blocking check by removing continue-on-error.
      - name: Run deno check on changed files
        if: steps.changed.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "━━━ Checking ${file} ━━━"
            if deno check "$file" 2>&1; then
              echo "  ✓ ${file} passed deno check"
            else
              echo "  ✗ ${file} FAILED deno check (advisory — not blocking PR)" >&2
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/changed_function_files.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "" >&2
            echo "${FAILED} file(s) had deno check warnings — see log above" >&2
            echo "Pre-existing type errors in ops-api and send-quote are known." >&2
            echo "This check will become blocking once those are resolved." >&2
            exit 1
          fi

          echo "All changed files passed deno check"

      # Hard-blocking import resolution check — catches parse errors and
      # broken imports that would cause a deploy to fail at runtime.
      # Uses --no-check to skip type checking (which is handled above).
      - name: Deno cache (import resolution check)
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "━━━ Caching ${file} ━━━"
            if deno cache --no-check "$file" 2>&1; then
              echo "  ✓ ${file} imports resolved"
            else
              echo "  ✗ ${file} FAILED import resolution" >&2
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/changed_function_files.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "" >&2
            echo "${FAILED} file(s) failed import resolution — this IS blocking" >&2
            exit 1
          fi

          echo "All files passed import resolution check"

      - name: Shell syntax check on deploy scripts
        run: |
          # Verify shell scripts are syntactically valid
          for script in scripts/deploy-edge-function.sh scripts/stamp-ops-api-build-metadata.sh scripts/smoke-edge-functions.sh scripts/smoke-ops-api-action-surface.sh scripts/identify-edge-deploy-changes.sh scripts/apply-pending-migrations.sh scripts/check-edge-deploy-guardrails.sh scripts/check-edge-schema-preflight.sh scripts/check-ops-api-source-actions.sh scripts/check-no-committed-service-keys.sh scripts/check-makesafe-intake-health.sh; do
            if [ -f "$script" ]; then
              if bash -n "$script"; then
                echo "✓ ${script}"
              else
                echo "✗ ${script} has syntax errors"
                exit 1
              fi
            fi
          done

      - name: Test ops-api action-surface smoke contract
        run: |
          bash scripts/test/test-smoke-ops-api-action-surface.sh

      - name: Test bundled ops-api deploy metadata
        run: |
          bash scripts/test/test-stamp-ops-api-build-metadata.sh

      - name: Test Edge Function schema preflight
        run: |
          bash scripts/test/test-edge-schema-preflight.sh

      - name: Test make-safe intake watchdog check
        run: |
          bash scripts/test/test-check-makesafe-intake-health.sh

      - name: Test migration auto-apply
        run: |
          bash scripts/test/test-apply-pending-migrations.sh

      - name: Check visit outcome business records
        run: |
          deno test --allow-read supabase/functions/ops-api/visit_outcomes_test.ts

      # Debt Workshop (secureworks-wiki debt-workshop-spec.md; docs/debt-workshop/README.md):
      # the plain rules (scope, lane, kind, share, due dates, categories, steps with the
      # weekend shift, templates, the bank-feed matcher), the Supabase store, and every
      # debt_ws_ action over an in-memory store. Sending, the agent, auto-send and Jan's
      # list are all proven off by default; every send runs the live Xero and bank checks.
      # The 8 Oct review fixes are pinned here too: one cached, paged bank read reaching
      # the oldest open invoice; the statement and Jan list bank checks; Jan's list failing
      # closed; server-key denial on staff actions; the agent queue blocked without the
      # feed; the template amount bar; company aliases; numbered reference endings.
      # Shared fences (12 Oct): the invoice's payer owns the contact, conversation and link.
      - name: Test the Debt Workshop rules, store, dependencies, actions and the debt report
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/ops-api/debt_ws_rules_test.ts \
            supabase/functions/ops-api/debt_ws_store_test.ts \
            supabase/functions/ops-api/debt_ws_deps_test.ts \
            supabase/functions/ops-api/debt_ws_actions_test.ts \
            supabase/functions/ops-api/debt_ws_payer_test.ts \
            supabase/functions/ops-api/debt_ws_report_test.ts \
            supabase/functions/ops-api/debt_ws_report_pdf_test.ts

      # Paid close-out (13 Oct 2026): a paid fencing or patio job goes to Get Review
      # (the strict paid rule, the holds, compare and set), one review text per job
      # (claim first, 90-day look-back, every paying owner), the 24-hour archive
      # sweep and the dry-run Complete backlog list; get_review is a real stage and a
      # GHL stage event can no longer pull a card out of Get Review or the archive.
      - name: Test the paid close-out rule, review sender, receipt sender, sweeps and stage
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/_shared/job_paid_closeout_test.ts \
            supabase/functions/ops-api/job_closeout_test.ts \
            supabase/functions/ops-api/job_receipt_test.ts \
            supabase/functions/_shared/stage-gate/job-state-machine_test.ts \
            supabase/functions/_shared/stage-gate/engine_test.ts \
            supabase/functions/ghl-webhook/stage_rank_test.ts

      # The read-only close-out block the Ops board and job view read (staff only,
      # fencing and patio, one batched read). It imports index.ts, so it runs with
      # the flags of the other index-importing steps (same --no-check reason).
      - name: Test the paid close-out read block on pipeline and job_detail
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/job_closeout_read_test.ts

      # A service-role key committed in 2026-03 stayed live for six months.
      # Refuse any tracked service_role JWT or sb_secret_ key, whatever path
      # it sits under.
      - name: Refuse committed service keys
        run: |
          bash scripts/test/test-check-no-committed-service-keys.sh
          bash scripts/check-no-committed-service-keys.sh

      - name: Check migration extension schema contract
        run: |
          deno test --allow-read supabase/functions/ops-api/migration_extension_schema_test.ts

      # The repair intake pipeline routes SES work orders to a NEW jobs.type and
      # a NEW money-path branch, so its suite is CI-guarded rather than left to
      # the local-only `deno task test:ops-api`. These files also carry the
      # controls proving the five untouched SES families, the MakeSafe board
      # exclusions and the non-repair Xero categories still behave exactly as
      # they did. --no-check matches the repo's known pre-existing type errors in
      # sibling ops-api test files; the assertions themselves are fully executed.
      - name: Check repair intake routing and stage-write contracts, and the quote builder
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/repair_intake_routing_test.ts \
            supabase/functions/ops-api/repair_classifier_routing_test.ts \
            supabase/functions/ops-api/repair_stage_write_test.ts \
            supabase/functions/ops-api/insurance_repairs_board_test.ts \
            supabase/functions/ops-api/insurance_repairs_pipeline_test.ts \
            supabase/functions/ops-api/quote_builder_test.ts

      # Builder mail read from a general company Group (swwa@) must never store
      # or download anyone else's mail, and one purchase order must stay one job
      # when it reaches both swwa@ and ses@. The runtime file is filtered because
      # it carries an unrelated pre-existing failure. Same --no-check reason as
      # above.
      - name: Test sender-scoped intake Groups and Ambrose two-address intake
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/monitor_ses_sender_scoped_groups_test.ts \
            supabase/functions/ops-api/makesafe_ambrose_intake_test.ts
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            --filter "Ambrose" \
            supabase/functions/ops-api/makesafe_deterministic_intake_runtime_test.ts

      # Automatic repair intake (flag repair_intake_auto_v1): the pure rules, and
      # the scan replays of the repair orders it exists for. Every scan test of
      # it is named "repair intake: ..." so the filter runs them all; the
      # runtime file is filtered for the reason given above. The last run is the
      # end-to-end proof that the Trade App's my_jobs gives an allocated trade
      # no builder order value.
      - name: Test automatic repair intake
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/repair_intake_auto_test.ts
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            --filter "repair intake:" \
            supabase/functions/ops-api/makesafe_deterministic_intake_runtime_test.ts
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            --filter "builder's order value" \
            supabase/functions/ops-api/trade_app_visibility_rules_test.ts

      # The one staff text for a new job (docs/repair-intake-auto-v1.md,
      # "Messages"): a repair job is told to the repair recipient in repair
      # words, on the approval path and the scan path, and the make-safe text
      # and its recipient are pinned byte for byte. Every SMS in these files is
      # a fake transport. Same --no-check reason as above.
      - name: Test the new job staff text for repair and make-safe jobs
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/makesafe_hugo_notification_test.ts \
            supabase/functions/ops-api/makesafe_hugo_notification_index_test.ts \
            supabase/functions/ops-api/makesafe_intake_settlement_test.ts

      # An adapter registered in code but missing from the database's adapter
      # list is refused on every case insert and nothing else notices (Ambrose,
      # 12 Oct 2026). Compares the real registry with the newest definition of
      # makesafe_intake_cases_deterministic_shapes_check in the migrations.
      - name: Check every intake adapter is admitted by the database
        run: |
          deno test --allow-read \
            supabase/functions/ops-api/makesafe_adapter_admission_contract_test.ts

      # Trade invoice time entries (docs/trade-invoice-time-entries-2026-10-12.md):
      # every trade invoice write path keeps the date worked and the start and
      # finish time the trade sent on a line, and derives none itself, under
      # both states of the enforcement flag. Drives the real
      # ops-api request handler with every database call answered by a fetch
      # stub. Same --no-check reason as the step above.
      - name: Test trade invoice time entries
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/trade_invoice_time_entry_test.ts \
            supabase/functions/ops-api/trade_invoice_weekly_resolver_test.ts

      # Trade recurring deductions (docs/trade-recurring-deductions-2026-10-13.md):
      # one trade's weekly ute hire comes off the amount payable of his weekly
      # invoice, once per invoice week, never below zero, and no other trade's
      # invoice changes in any figure or field. Drives the real ops-api request
      # handler with every database call answered by a fetch stub, plus the
      # money and audit PDF suites the deduction is built on.
      - name: Test trade recurring deductions
        run: |
          deno test --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/trade_invoice_recurring_deduction_test.ts \
            supabase/functions/ops-api/trade_invoice_money_test.ts \
            supabase/functions/ops-api/trade_invoice_money_audit_test.ts \
            supabase/functions/ops-api/trade_invoice_pdf_test.ts \
            supabase/functions/ops-api/trade_money_test.ts

      # Automated money messages are off (captain, 30 Sep 2026). Drives the
      # real ops-api and daily-digest request handlers with every database,
      # Xero and GHL call answered by a fetch spy. Same --no-check reason as
      # above.
      - name: Test automated money messages stay off
        run: |
          deno test --no-check --allow-read --allow-env \
            supabase/functions/ops-api/debt_autotexts_off_test.ts \
            supabase/functions/daily-digest/deposit_autotexts_off_test.ts

      # The Dispatch tab's list read is opt-in on `pipeline`: the plain read must
      # stay exactly as it was, and the list must never drop a job past the
      # 1000-row ceiling or select the whole scope blob. Same --no-check reason
      # as above.
      # Slice 3 adds the stage rail: its rules, the stage read on the list and
      # the two staff-only writes, none of which may touch the job status.
      # Slice 4 adds Materials by supplier: its count rule, the one read, the six
      # writes (none may touch jobs, suppliers, purchase orders or any event
      # table) and the two list fields, which never read as 0 on a failed read.
      # Slice 5 adds a purchase order and its email, tested by outcome: the
      # PDF a supplier reads, the two reads and eight writes end to end (only
      # a send or a reply reaches the stubbed transport), and its fixes to
      # create_po, the reply reader's tag and the reply analysis.
      - name: Test the Dispatch list and job notes reads
        run: |
          deno test --no-check --allow-env --allow-net=127.0.0.1 --allow-read \
            supabase/functions/ops-api/dispatch_job_list_test.ts \
            supabase/functions/ops-api/dispatch_stage_test.ts \
            supabase/functions/ops-api/dispatch_materials_test.ts \
            supabase/functions/ops-api/dispatch_order_pdf_test.ts \
            supabase/functions/ops-api/dispatch_orders_store_test.ts \
            supabase/functions/ops-api/purchase_order_attribution_test.ts \
            supabase/functions/receive-po-email/po_email_tag_test.ts

      # Dispatch v2 slice 8: supplier replies matched to orders, delivery date
      # suggestions (rules, engine on an in-memory store, migration text).
      - name: Test the Dispatch v2 supplier replies
        run: |
          deno test --no-check --allow-env --allow-read             supabase/functions/ops-api/dispatch_v2_replies_rules_test.ts             supabase/functions/ops-api/dispatch_v2_replies_test.ts             supabase/functions/ops-api/dispatch_v2_replies_store_test.ts

      - name: Test edge deploy workflow classification
        run: |
          bash scripts/test/test-deploy-edge-functions-workflow.sh

      - name: Test shared provider, invoice and communication contracts
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/send-outlook-email/outlook_action_behavior_test.ts \
            supabase/functions/send-outlook-email/outlook_authorization_test.ts \
            supabase/functions/send-outlook-email/ses_delivery_fence_test.ts \
            supabase/functions/send-quote/xero_quote_outcome_test.ts \
            supabase/functions/send-quote/send_runs_request_test.ts \
            supabase/functions/send-quote/quote_party_view_test.ts \
            supabase/functions/ghl-proxy/hardening_helpers_test.ts \
            supabase/functions/ghl-proxy/provider_reads_test.ts \
            supabase/functions/ghl-proxy/lead_search_test.ts \
            supabase/functions/ghl-proxy/sms_sender_default_test.ts \
            supabase/functions/ghl-proxy/send_sms_contact_guard_test.ts \
            supabase/functions/_shared/job_contact_membership_test.ts \
            supabase/functions/ghl-proxy/calendar_events_test.ts \
            supabase/functions/ghl-proxy/calendar_appointment_test.ts \
            supabase/functions/ghl-proxy/calendar_appointment_release_test.ts \
            supabase/functions/xero-sync/xero_invoice_reconciliation_test.ts \
            supabase/functions/xero-sync/xero_mirror_check_test.ts \
            supabase/functions/ops-api/xero_void_mirror_test.ts \
            supabase/functions/xero-sync/xero_age_test.ts \
            supabase/functions/xero-sync/project_job_link_test.ts \
            supabase/functions/ops-api/job_profit_test.ts \
            supabase/functions/_shared/xero_cooldown_test.ts \
            supabase/functions/ops-api/invoice_create_contract_test.ts \
            supabase/functions/ops-api/ops_api_operator_auth_test.ts \
            supabase/functions/ops-api/xero_accpay_books_test.ts \
            supabase/functions/ops-api/xero_receivables_read_test.ts \
            supabase/functions/ops-api/xero_attachment_test.ts \
            supabase/functions/ops-api/xero_post_rate_limit_retry_test.ts \
            supabase/functions/ops-api/read_job_record_test.ts \
            supabase/functions/ops-api/ses_report_trigger_test.ts \
            supabase/functions/ops-api/xero_bank_read_test.ts \
            supabase/functions/ops-api/xero_reports_read_test.ts \
            supabase/functions/ops-api/trade_invoice_wo_line_lock_test.ts \
            supabase/functions/ops-api/job_work_orders_test.ts \
            supabase/functions/ops-api/job_work_order_crew_invoice_test.ts \
            supabase/functions/ops-api/quote_work_order_lines_test.ts \
            supabase/functions/ops-api/job_work_order_quote_fill_test.ts \
            supabase/functions/ops-api/job_work_order_quote_fill_handler_test.ts \
            supabase/functions/ops-api/work_order_customer_variations_test.ts \
            supabase/functions/ops-api/sales_booking_read_test.ts \
            supabase/functions/ops-api/sales_booking_outlook_test.ts \
            supabase/functions/ops-api/sales_booking_pack_test.ts \
            supabase/functions/ops-api/sales_booking_confirmation_test.ts \
            supabase/functions/ops-api/sales_booking_execute_test.ts \
            supabase/functions/ops-api/sales_booking_owner_approval_test.ts \
            supabase/functions/ops-api/sales_booking_availability_test.ts \
            supabase/functions/ops-api/sales_booking_lead_owner_test.ts \
            supabase/functions/ops-api/sales_booking_execution_read_test.ts \
            supabase/functions/ops-api/sales_booking_routes_test.ts \
            supabase/functions/reporting-api/reporting_staff_gate_test.ts \
            supabase/functions/reporting-api/job_context_timeline_test.ts

      # This suite imports the serving monolith, whose pre-existing type errors
      # are reported by the advisory deno check above. Runtime assertions still
      # block release, and all provider calls are injected fixtures.
      - name: Test proposed SMS receipts, replay holds, job conversation sources, the job message timeline and its period window, the job search with closed jobs, the job commercial read, job freshness, the job state card, the job story doors, the job overview door, the ledger correction door, the context scorecard door, actor recording and monitored mailboxes
        run: |
          deno test --no-check --allow-read --allow-env \
            supabase/functions/ops-api/context_visibility_test.ts \
            supabase/functions/ops-api/proposed_sms_receipt_test.ts \
            supabase/functions/ops-api/chase_sms_contact_guard_test.ts \
            supabase/functions/ops-api/retired_booking_actions_test.ts \
            supabase/functions/ops-api/invoice_context_test.ts \
            supabase/functions/ops-api/job_conversation_chat_logs_retired_test.ts \
            supabase/functions/ops-api/job_conversation_party_roles_test.ts \
            supabase/functions/ops-api/job_commercial_read_test.ts \
            supabase/functions/ops-api/job_freshness_test.ts \
            supabase/functions/ops-api/job_state_card_test.ts \
            supabase/functions/ops-api/job_story_door_test.ts \
            supabase/functions/ops-api/job_overview_read_test.ts \
            supabase/functions/ops-api/context_scorecard_door_test.ts \
            supabase/functions/ops-api/job_conversation_timeline_test.ts \
            supabase/functions/ops-api/job_conversation_window_test.ts \
            supabase/functions/ops-api/job_conversation_payer_threads_test.ts \
            supabase/functions/ops-api/job_conversation_held_messages_test.ts \
            supabase/functions/ops-api/search_jobs_closed_test.ts \
            supabase/functions/ops-api/trade_variation_request_test.ts \
            supabase/functions/ops-api/context_unlinked_test.ts \
            supabase/functions/ops-api/ledger_person_edit_test.ts \
            supabase/functions/ops-api/actor_calls_test.ts \
            supabase/functions/ops-api/actor_calls_handler_test.ts \
            supabase/functions/ops-api/monitored_mailboxes_test.ts \
            supabase/functions/ops-api/job_closeout_status_cas_test.ts

      # Slice C1b: the GHL webhook receiver's two-proof auth (observe until
      # GHL_WEBHOOK_AUTH_MODE=enforce), ids-only webhook_log receipts and the
      # removed body.job_id trust, driven through the real handler. Slice C1c:
      # messages and the app's notes, tasks and appointments through the one
      # builder and writer behind ghl_message_capture_v2, the id-less targeted
      # read, ghl_webhook_receipts, and ghl-webhook's message branch removed.
      # Slice T1: CallCompleted writes its legacy row with the flag off and is a
      # doorbell (targeted read, calls saved as client.call_logged) with it on.
      # CustomerReplied: the GHL workflow post for an inbound text is the same
      # doorbell, and a reconciler pass after it writes nothing new.
      # UserReplied: the staff-reply workflow post is that doorbell too; it
      # ignores any posted conversation id and reads the newest conversation.
      # Gap plan B-4: invoice evidence on its job. The placement plan is the
      # unique reference matcher's (never re-derived), xero-sync's recent-row
      # step is off until its flag and writes nothing on a partial read, and
      # ops-api's invoice writers name the invoice's own job.
      - name: Test Xero invoice evidence placement
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/_shared/evidence/xero_invoice_evidence_plan_test.ts \
            supabase/functions/xero-sync/invoice_evidence_place_test.ts \
            supabase/functions/ops-api/invoice_evidence_writers_test.ts

      # The email reader (EM2) and its group history walk (W7): cursor
      # handling, the restart loop of 5 Oct 2026 and resume-where-it-stopped,
      # over fake Graph reads and a fake run ledger. No network. Its row
      # builder next to it: who our own email went to (group mailbox
      # audience, 9 Oct 2026), and the builder rows the PostgreSQL contracts
      # feed capture_business_event and context_email_audience_resolve.
      - name: Test the Outlook email reader
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/outlook-mail-capture/ \
            supabase/functions/_shared/evidence/outlook_mail_test.ts \
            supabase/functions/_shared/evidence/outlook_mail_contract_rows_test.ts \
            supabase/functions/_shared/evidence/outlook_mail_audience_test.ts \
            supabase/functions/_shared/evidence/outlook_mail_audience_contract_rows_test.ts

      - name: Test GHL webhook receiver auth and receipts
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/ghl-webhook-receiver/receiver_auth_test.ts \
            supabase/functions/ghl-webhook-receiver/receiver_c1b_test.ts \
            supabase/functions/ghl-webhook-receiver/receiver_c1c_test.ts \
            supabase/functions/ghl-webhook-receiver/receiver_t1_test.ts \
            supabase/functions/ghl-webhook-receiver/receiver_customer_replied_test.ts \
            supabase/functions/ghl-webhook-receiver/receiver_user_replied_test.ts \
            supabase/functions/ghl-webhook/message_webhook_test.ts

      # Slice C1a: the shared GHL row builder, ghl-proxy send_sms through the one
      # writer capture_business_event, and the builder rows the PostgreSQL
      # contract feeds that writer.
      - name: Test GHL message row builder and send_sms evidence
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/_shared/evidence/ghl_message_test.ts \
            supabase/functions/_shared/evidence/ghl_message_contract_rows_test.ts \
            supabase/functions/_shared/evidence/ghl_call_pair_test.ts \
            supabase/functions/_shared/evidence/party_roles_test.ts \
            supabase/functions/ghl-proxy/sms_capture_test.ts \
            supabase/functions/ghl-proxy/send_sms_response_test.ts

      - name: Test the 15-minute GHL message reconciler
        run: |
          deno test --allow-read \
            supabase/functions/ghl-message-reconcile/reconcile_test.ts \
            supabase/functions/ghl-message-reconcile/handler_test.ts

      # Slice M4: the one-off GHL history load for live-job contacts (dry run by
      # default, backfill rows only, resume, the day's job count) and its link
      # action (a GHL contact on live jobs with none, exact key match to one
      # contact only), on the design's named rows.
      - name: Test the GHL history load and link action
        run: |
          deno test --allow-read \
            supabase/functions/ghl-history-load/history_load_test.ts \
            supabase/functions/ghl-history-load/link_test.ts \
            supabase/functions/ghl-history-load/handler_test.ts

      # Slice T2: the GHL call transcript fetcher (the one transcript reader,
      # the transcript row, the fetcher's per-call rules, its live and history
      # modes and its HTTP door) on the recorded call and transcript shapes.
      - name: Test the GHL call transcript fetcher
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/_shared/ghl/call_transcript_test.ts \
            supabase/functions/_shared/evidence/ghl_call_transcript_row_test.ts \
            supabase/functions/ghl-call-transcript-fetch/fetch_test.ts \
            supabase/functions/ghl-call-transcript-fetch/handler_test.ts

      # Gap plan B-5: the document text reader (file kinds, own-storage-only
      # reads, the text gate, the evidence row, a run and its HTTP door) on
      # fake reads and writes; the PDF extractor is ops-api's, tested there.
      - name: Test the document text reader
        run: |
          deno test --allow-read \
            supabase/functions/context-document-text/read_test.ts \
            supabase/functions/context-document-text/handler_test.ts

      # Gap plan B-5b: the vision reader's door (pictures out of scans and
      # photos, what spends a model call and what does not, the answer as
      # evidence, the HTTP modes) on fake reads and writes. No model.
      - name: Test the document vision reader
        run: |
          deno test --allow-read \
            supabase/functions/context-document-vision/images_test.ts \
            supabase/functions/context-document-vision/vision_test.ts \
            supabase/functions/context-document-vision/handler_test.ts

      # Slice B0: the placement keys and token rule (TypeScript twin of the SQL
      # helpers) on the one fixture table, and proof that the migration
      # contract runs the SQL helpers on that same table.
      - name: Test shared placement keys and token rule
        run: |
          deno test --allow-read \
            supabase/functions/_shared/job_refs_test.ts \
            supabase/functions/_shared/job_refs_contract_rows_test.ts

      # Slice EM0: monitor-inbox classifies by rules on both paths, with no
      # model or network call (named email rows, fetch trapped, source pin).
      - name: Test monitor-inbox rules-only email triage
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/monitor-inbox/classify_email_test.ts

      # Slice EM1: the old monitor-inbox path stays pinned to its own five
      # mailboxes and two groups, and never reads monitored_mailboxes (the new
      # poller's list, behind email_capture_v2). email.md review M14, row E22.
      - name: Test the pinned old mailbox poll
        run: |
          deno test --allow-read \
            supabase/functions/monitor-inbox/legacy_mailboxes_test.ts

      # Gap map W9: one email sent to several of the old path's mailboxes is
      # one evidence row (the same internet message id, or for rows saved
      # before it was kept, the same sender, subject, words and time from
      # another mailbox); an unreadable lookup writes as before.
      - name: Test the old mail path writes one evidence row per email
        run: |
          deno test --allow-read \
            supabase/functions/monitor-inbox/self_copy_test.ts \
            supabase/functions/monitor-inbox/reader_handover_test.ts

      # Slice F-ACT: the one actor rule (verified user, else x-sw-actor on a
      # server-key call, else actor_missing; never refused).
      - name: Test the shared request actor rule
        run: |
          deno test --allow-read \
            supabase/functions/_shared/request_actor_test.ts

      - name: Test shared Xero transport and uncertain outcomes
        run: |
          deno test --no-check --allow-read --allow-env \
            supabase/functions/xero-sync/xero_transport_test.ts

      # Legacy service-role key retirement, runbook Step 4
      # (docs/evidence/legacy-service-role-key-removal-2026-09-30.md): the one
      # service-credential check and the functions that use it.
      - name: Test service credential verification
        run: |
          deno test --no-check --allow-read --allow-env --allow-net=127.0.0.1 \
            supabase/functions/_shared/service_credential_test.ts \
            supabase/functions/ops-api/service_credential_handler_test.ts \
            supabase/functions/ops-api/makesafe_cost_report_test.ts

      - name: Test group work orders and completion-pack email
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/ops-api/group_work_order_test.ts \
            supabase/functions/ops-api/trade_client_signoff_test.ts \
            supabase/functions/completion-pack/email_plan_test.ts \
            supabase/functions/completion-pack/client_signature_test.ts
          deno test --no-check --allow-read --allow-env \
            supabase/functions/ops-api/trade_client_signoff_wiring_test.ts

  # Execute migration behaviour against PostgreSQL, not a text parser. The
  # repository's historical migrations include Supabase-only schemas and live
  # baseline drift, so the contract registry supplies the narrow prerequisites
  # for each registered migration and applies those migrations in timestamp
  # order. See supabase/tests/migration-contracts/README.md.
  migration-contracts:
    runs-on: ubuntu-latest
    # 40, not 20: each registered contract case could replay the whole stack
    # (fail-closed, rollback and break proofs). Passing suites were cancelled at
    # the limit of 5, then of 10, then of 20: on 5 Oct 2026 main ran 12 to 19
    # minutes, and job story v1 (four cases) was cancelled at 20 with every
    # contract, rollback and fail-closed proof passed and 23 of 71 break proofs
    # done (about 27 minutes in all on a hosted runner).
    # 90, not 40: the replays grow with every registered case. On 7 Oct 2026 a
    # PR adding one case to main took 37 min 51 s here (PR 986), and the
    # scorecard v2 PR carries eight more (the seven 7 Oct data sources and v2).
    # On 16 Oct 2026 (144 cases, about 320 replays) runs took 35 to 80 min and
    # slower runners were cancelled here. Proofs now start from a copy of a
    # database built once (run.sh), not a replay, so the job no longer grows
    # with the square of the case count.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Run PostgreSQL migration contracts
        env:
          MIGRATION_CONTRACT_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_CONTRACT_DISPOSABLE_ACK: I-confirm-this-is-disposable-local-postgres
        run: bash supabase/tests/migration-contracts/run.sh

  # Automated coverage for the SES Reporting proof harness. This runs the fast
  # TypeScript check, the recipient / DRAFT / marker / cleanup safety contract,
  # and the fixture voyage (which proves harness mechanics only and is labelled
  # SIMULATED, NOT PROOF). The live seven-stage credentialed proof is never run
  # here: it writes real product artifacts and sends real email, so it stays a
  # deliberate one-command manual run — see docs/ses-reporting-proof-harness.md.
  ses-proof-harness:
    runs-on: ubuntu-latest

    # The harness npm project lives here, not at the repo root. A root
    # package.json would make Deno 2 default nodeModulesDir to auto and npm
    # install the Playwright toolchain inside the deno-check job above.
    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changed harness files
        id: changed
        working-directory: .
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- 'tests/e2e/**' | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No proof harness files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.changed.outputs.has_changes == 'true'
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.has_changes == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: npm ci

      # Only chromium. The harness never drives firefox or webkit, so installing
      # the full browser set would just make every PR slower.
      - name: Install Chromium for Playwright
        if: steps.changed.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        if: steps.changed.outputs.has_changes == 'true'
        run: npm run typecheck:ses-proof

      - name: Safety contract (recipient, DRAFT, marker, cleanup gates)
        if: steps.changed.outputs.has_changes == 'true'
        env:
          SES_PROOF_RUN_ID: ci-safety-contract-${{ github.run_id }}
        run: npm run test:ses-proof-safety

      - name: Fixture voyage (SIMULATED, NOT PROOF)
        if: steps.changed.outputs.has_changes == 'true'
        env:
          SES_PROOF_RUN_ID: ci-fixture-${{ github.run_id }}
        run: npm run proof:ses:fixture

      - name: Upload fixture voyage evidence
        if: always() && steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ses-proof-fixture-evidence
          path: artifacts/ses-reporting-proof/
          if-no-files-found: ignore
          retention-days: 7
