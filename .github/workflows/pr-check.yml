name: PR Check — Edge Functions

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      # Migrations-only PRs must still trigger the required deno-check status
      # (the job no-ops to pass when no function files changed) — otherwise
      # branch protection waits forever and the PR can never merge.
      - 'supabase/migrations/**'
      - 'scripts/deploy-edge-function.sh'
      - 'scripts/smoke-edge-functions.sh'
      - 'scripts/smoke-ops-api-action-surface.sh'
      - 'scripts/_ops-api-required-actions.txt'
      - 'scripts/identify-edge-deploy-changes.sh'
      - 'scripts/check-edge-deploy-guardrails.sh'
      - 'scripts/check-ops-api-source-actions.sh'
      - 'scripts/test/test-deploy-edge-functions-workflow.sh'
      - 'scripts/test/test-smoke-ops-api-action-surface.sh'
      - '.github/workflows/deploy-edge-functions.yml'
      - '.github/workflows/pr-check.yml'
      # Same reason as migrations above: deno-check is a REQUIRED status, so any
      # path that can be changed alone must trigger it or the PR is unmergeable.
      # A watchdog-only PR hit exactly that and sat at BLOCKED with zero checks.
      - '.github/workflows/makesafe-intake-watchdog.yml'
      # Same reason again for the SES Reporting proof harness: these paths can be
      # changed alone, and the ses-proof-harness job below is the only automated
      # coverage the harness has.
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.playwright.json'
      - 'docs/ses-reporting-proof-harness.md'

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Identify changed function files
        id: changed
        run: |
          # Use the PR base SHA for diffing (more reliable in CI)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get the list of changed function index.ts files in the PR.
          # --diff-filter=d excludes deletions: a removed function has no file
          # left to check, and passing its path to deno would fail the job.
          CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- 'supabase/functions/*/index.ts' | sort -u)
          SHARED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- 'supabase/functions/_shared/*.ts' 'supabase/functions/_shared/**/*.ts' | sort -u)

          if [ -z "$CHANGED" ] && [ -z "$SHARED" ]; then
            echo "No edge function files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            # Write changed files to a temp file for the check step
            {
              echo "$CHANGED"
              echo "$SHARED"
            } | grep -v '^$' | sort -u > /tmp/changed_function_files.txt
            echo "Changed files:"
            cat /tmp/changed_function_files.txt
          fi

      # Deno type check — advisory (non-blocking) for now because ops-api
      # and send-quote have pre-existing type errors that would block every
      # PR touching them. The check still runs so new type regressions are
      # visible in the CI log. Once the known errors are fixed, switch to
      # a hard-blocking check by removing continue-on-error.
      - name: Run deno check on changed files
        if: steps.changed.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "━━━ Checking ${file} ━━━"
            if deno check "$file" 2>&1; then
              echo "  ✓ ${file} passed deno check"
            else
              echo "  ✗ ${file} FAILED deno check (advisory — not blocking PR)" >&2
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/changed_function_files.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "" >&2
            echo "${FAILED} file(s) had deno check warnings — see log above" >&2
            echo "Pre-existing type errors in ops-api and send-quote are known." >&2
            echo "This check will become blocking once those are resolved." >&2
            exit 1
          fi

          echo "All changed files passed deno check"

      # Hard-blocking import resolution check — catches parse errors and
      # broken imports that would cause a deploy to fail at runtime.
      # Uses --no-check to skip type checking (which is handled above).
      - name: Deno cache (import resolution check)
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "━━━ Caching ${file} ━━━"
            if deno cache --no-check "$file" 2>&1; then
              echo "  ✓ ${file} imports resolved"
            else
              echo "  ✗ ${file} FAILED import resolution" >&2
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/changed_function_files.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "" >&2
            echo "${FAILED} file(s) failed import resolution — this IS blocking" >&2
            exit 1
          fi

          echo "All files passed import resolution check"

      - name: Shell syntax check on deploy scripts
        run: |
          # Verify shell scripts are syntactically valid
          for script in scripts/deploy-edge-function.sh scripts/smoke-edge-functions.sh scripts/smoke-ops-api-action-surface.sh scripts/identify-edge-deploy-changes.sh scripts/check-edge-deploy-guardrails.sh scripts/check-ops-api-source-actions.sh; do
            if [ -f "$script" ]; then
              if bash -n "$script"; then
                echo "✓ ${script}"
              else
                echo "✗ ${script} has syntax errors"
                exit 1
              fi
            fi
          done

      - name: Test ops-api action-surface smoke contract
        run: |
          bash scripts/test/test-smoke-ops-api-action-surface.sh

      - name: Test edge deploy workflow classification
        run: |
          bash scripts/test/test-deploy-edge-functions-workflow.sh

  # Automated coverage for the SES Reporting proof harness. This runs the fast
  # TypeScript check, the recipient / DRAFT / marker / cleanup safety contract,
  # and the fixture voyage (which proves harness mechanics only and is labelled
  # SIMULATED, NOT PROOF). The live seven-stage credentialed proof is never run
  # here: it writes real product artifacts and sends real email, so it stays a
  # deliberate one-command manual run — see docs/ses-reporting-proof-harness.md.
  ses-proof-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changed harness files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED=$(git diff --name-only --diff-filter=d "${BASE_SHA}" "${HEAD_SHA}" -- \
            'tests/e2e/**' \
            'package.json' \
            'package-lock.json' \
            'playwright.config.ts' \
            'tsconfig.playwright.json' | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No proof harness files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.has_changes == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: npm ci

      # Only chromium. The harness never drives firefox or webkit, so installing
      # the full browser set would just make every PR slower.
      - name: Install Chromium for Playwright
        if: steps.changed.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        if: steps.changed.outputs.has_changes == 'true'
        run: npm run typecheck:ses-proof

      - name: Safety contract (recipient, DRAFT, marker, cleanup gates)
        if: steps.changed.outputs.has_changes == 'true'
        env:
          SES_PROOF_RUN_ID: ci-safety-contract-${{ github.run_id }}
        run: npm run test:ses-proof-safety

      - name: Fixture voyage (SIMULATED, NOT PROOF)
        if: steps.changed.outputs.has_changes == 'true'
        env:
          SES_PROOF_RUN_ID: ci-fixture-${{ github.run_id }}
        run: npm run proof:ses:fixture

      - name: Upload fixture voyage evidence
        if: always() && steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ses-proof-fixture-evidence
          path: artifacts/ses-reporting-proof/
          if-no-files-found: ignore
          retention-days: 7
