name: MakeSafe Intake Watchdog

# WATCHDOG-OF-WATCHDOG (coordinator red-team #2).
# The in-function B1/D5 alarms die together with pg_cron or a paused Supabase project
# — nobody watches from OUTSIDE. This scheduled workflow reads the make-safe intake
# health row every 30 minutes and FAILS the run when the read cannot be made or the
# last completed scan is stale. A failing scheduled workflow emails the repo owners
# (GitHub's default), so this is an alert channel that survives the ENTIRE Supabase
# project being down.
#
# HOW IT READS: scripts/check-makesafe-intake-health.sh runs one fixed SELECT on
# public.makesafe_intake_health through the Supabase Management API
# `/database/query` endpoint with `read_only: true`, using the existing
# SUPABASE_ACCESS_TOKEN (already used by the deploy workflow). No new secret.
#
# It used to call ops-api `?action=intake_health` with the shared SW_API_KEY. PR #667
# (12 Aug 2026) made ops-api refuse that key on every protected action, so every run
# from 2026-08-12T19:04Z failed with 401 user_jwt_required while intake itself was
# healthy. The captain chose this read over adding an ops-api credential.
#
# SECURITY: SUPABASE_ACCESS_TOKEN is an account-wide Management API token. This job
# hands it only to the check script, which sends one read-only SELECT and never
# prints it. The secret is scoped to the `production` ENVIRONMENT, not the repo, so
# this job must declare `environment: production` or the token resolves to the empty
# string and every run fails on the "not set" guard.
#
# NOTE: scheduled workflows only run on the default branch, so this activates on merge
# to main.

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes (UTC)
  workflow_dispatch: {} # allow a manual check

permissions:
  contents: read

jobs:
  intake-health:
    runs-on: ubuntu-latest
    # SUPABASE_ACCESS_TOKEN is a `production` environment secret. Without this line
    # the job gets an empty token and fails every run. The deploy workflow declares
    # the same environment for the same reason.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read make-safe intake health and fail on unreachable/stale
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Fail if the last completed scan is older than this many minutes. The scan
          # runs every 2 min; the workflow runs every 30 min. 30 min stale = clearly broken.
          STALE_MINUTES: '30'
        run: bash scripts/check-makesafe-intake-health.sh
