name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'scripts/identify-edge-deploy-changes.sh'
      - 'scripts/apply-pending-migrations.sh'
      - 'scripts/migration-autoapply-exclusions.txt'
      - 'scripts/migration-autoapply-ledger-aliases.txt'
      - 'scripts/check-edge-schema-preflight.sh'
      - 'scripts/edge-function-schema-requirements.txt'
      - 'scripts/check-ops-api-source-actions.sh'
      - 'scripts/stamp-ops-api-build-metadata.sh'
      - 'scripts/smoke-ops-api-action-surface.sh'
      - 'scripts/_ops-api-required-actions.txt'
      - '.github/workflows/deploy-edge-functions.yml'

permissions:
  contents: read

concurrency:
  group: production-edge-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.repository == 'SecureWorks-GROUP/secureworks-backend'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify function-source and verification-only changes
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/identify-edge-deploy-changes.sh

      - name: Apply pending reviewed migrations
        if: steps.changed.outputs.functions != ''
        env:
          PROJECT_REF: kevgrhcjxspbxgovpmfl
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          bash scripts/apply-pending-migrations.sh

      - name: Post-apply check required production schema
        if: steps.changed.outputs.functions != ''
        env:
          CHANGED_FUNCTIONS: ${{ steps.changed.outputs.functions }}
          PROJECT_REF: kevgrhcjxspbxgovpmfl
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Keep the independent read-only guard after migration application.
          bash scripts/check-edge-schema-preflight.sh

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.functions != ''
        with:
          # Pinned to a concrete recent-stable release. `version: latest` made
          # setup-cli resolve the newest release at deploy time, which started
          # failing with "resolve latest release: Gateway Time-out". Pinning
          # removes that network dependency and keeps deploys deterministic.
          version: 2.105.0

      - name: Pre-deploy check ops-api source action surface
        if: steps.changed.outputs.verify_ops_api == 'true'
        run: |
          bash scripts/check-ops-api-source-actions.sh

      - name: Deploy changed edge functions
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="kevgrhcjxspbxgovpmfl"
          DEPLOYED_ANY=false

          for func in ${{ steps.changed.outputs.functions }}; do
            echo "━━━ Deploying ${func} ━━━"

            if [ "$func" = "ops-api" ]; then
              OPS_API_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              bash scripts/stamp-ops-api-build-metadata.sh \
                "${{ github.sha }}" \
                "${OPS_API_DEPLOYED_AT}"
              echo "EXPECTED_OPS_API_COMMIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
              echo "EXPECTED_OPS_API_DEPLOYED_AT=${OPS_API_DEPLOYED_AT}" >> "$GITHUB_ENV"
            fi

            # Read the JWT flag from the function's header comment (first 30 lines).
            # If the header contains '--no-verify-jwt', deploy without JWT verification.
            # Otherwise, deploy with default JWT verification enabled.
            JWT_FLAG=""
            if head -30 "supabase/functions/${func}/index.ts" 2>/dev/null | grep -q -- '--no-verify-jwt'; then
              JWT_FLAG="--no-verify-jwt"
              echo "  JWT flag: --no-verify-jwt (from header comment)"
            else
              echo "  JWT flag: default (verify-jwt enabled)"
            fi

            if supabase functions deploy "${func}" ${JWT_FLAG} --project-ref "${PROJECT_REF}"; then
              echo "  ✓ ${func} deployed successfully"
              DEPLOYED_ANY=true
            else
              echo "  ✗ ${func} deploy FAILED" >&2
              exit 1
            fi
          done

          if [ "$DEPLOYED_ANY" = true ]; then
            echo "All function deploys completed"
          fi

      - name: Smoke test deployed functions
        if: steps.changed.outputs.functions != ''
        run: |
          PROJECT_HOST="https://kevgrhcjxspbxgovpmfl.supabase.co"

          # Production-critical functions that get a post-deploy smoke test.
          # Each entry: FUNCTION_NAME  SAFE_PROBE_PATH
          # The probe path should be a lightweight endpoint that returns
          # 2xx/4xx when the function is live (NOT 5xx, which means broken).
          declare -A SMOKE_ENDPOINTS=(
            [ops-api]="/functions/v1/ops-api"
            [ghl-proxy]="/functions/v1/ghl-proxy"
            [send-quote]="/functions/v1/send-quote"
          )

          # Allow a short warm-up period after deploy
          sleep 5

          OVERALL_PASS=true

          for func in ${{ steps.changed.outputs.functions }}; do
            # Only smoke-test functions that have a defined endpoint
            if [ -z "${SMOKE_ENDPOINTS[$func]+x}" ]; then
              echo "  → ${func}: no smoke endpoint defined — skipping"
              continue
            fi

            echo "━━━ Smoke testing ${func} ━━━"
            URL="${PROJECT_HOST}${SMOKE_ENDPOINTS[$func]}"

            # These functions use --no-verify-jwt so an unauthenticated
            # request reaches the function. A 4xx (auth/action error)
            # proves the function is live; 5xx = broken deploy.
            HTTP_CODE=$(curl -sw "%{http_code}" -o "/tmp/${func}-smoke.out" --max-time 30 "${URL}" 2>/dev/null || echo "000")

            echo "  HTTP status: ${HTTP_CODE}"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
              echo "  ✓ ${func} smoke test passed (HTTP ${HTTP_CODE})"
            else
              echo "  ✗ ${func} smoke test FAILED (HTTP ${HTTP_CODE})" >&2
              BODY=$(cat "/tmp/${func}-smoke.out" 2>/dev/null | head -c 500)
              echo "  Response body: ${BODY}" >&2
              OVERALL_PASS=false
            fi
          done

          if [ "$OVERALL_PASS" = false ]; then
            echo "" >&2
            echo "One or more smoke tests failed — deploy may be broken" >&2
            exit 1
          fi

          echo "All smoke tests passed"

      - name: Smoke test ops-api action surface
        if: steps.changed.outputs.verify_ops_api == 'true'
        env:
          SW_API_KEY: ${{ secrets.SW_API_KEY }}
          EXPECTED_COMMIT_SHA: ${{ env.EXPECTED_OPS_API_COMMIT_SHA }}
          EXPECTED_DEPLOYED_AT: ${{ env.EXPECTED_OPS_API_DEPLOYED_AT }}
        run: |
          bash scripts/smoke-ops-api-action-surface.sh
